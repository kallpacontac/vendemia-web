<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes · Vendemia</title>
<link rel="stylesheet" href="./assets/app.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
.main{padding:16px 20px}
.inbox{display:grid;grid-template-columns:346px 1fr 262px;height:calc(100vh - 32px);
  background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--sh-card)}

/* ── LISTA ── */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list__head{padding:18px 18px 12px}
.list__head .t{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.list__head h2{font-size:17px;font-weight:800}
.list .search{width:100%;box-shadow:none;background:var(--bg-input)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fpill{white-space:nowrap;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-full);
  padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.14s}
.fpill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.convos{flex:1;overflow-y:auto;min-height:0}
.citem{display:flex;gap:12px;padding:14px 18px;cursor:pointer;border-left:3px solid transparent;transition:.12s;position:relative}
.citem:hover{background:var(--bg-input)}
.citem.active{background:#FFF6EE;border-left-color:var(--brand)}
.citem .info{flex:1;min-width:0}
.citem .top{display:flex;justify-content:space-between;align-items:center}
.citem b{font-size:14px;font-weight:700}
.citem .time{font-size:11px;color:var(--ink-mute)}
.citem .prev{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.botdot{width:8px;height:8px;border-radius:50%;position:absolute;left:50px;bottom:16px;border:2px solid #fff}

/* ── CHAT ── */
.chat{display:flex;flex-direction:column;min-height:0}
.chat__bar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.chat__who{display:flex;align-items:center;gap:12px}
.chat__who b{font-size:15px;font-weight:700}
.chat__who small{font-size:11.5px;color:var(--ink-mute)}
.bot-ctrl{display:flex;align-items:center;gap:12px}
.bot-ctrl .lbl{text-align:right}
.bot-ctrl .lbl b{font-size:13px;font-weight:700;display:block}
.bot-ctrl .lbl small{font-size:11px;color:var(--ink-mute)}
.banner{background:#FFFBEB;border-bottom:1px solid #FDE68A;padding:10px 20px;color:#92400E;font-size:13px;font-weight:600;display:none}
.banner.show{display:flex;align-items:center;gap:8px}
.banner svg{width:16px;height:16px}
.msgs{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;min-height:0}
.tstamp{align-self:center;font-size:11px;color:var(--ink-mute);font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:12px}
.tstamp::before,.tstamp::after{content:"";width:60px;height:1px;background:var(--line)}
.msg{max-width:70%;padding:11px 15px;font-size:14px;line-height:1.5;margin-bottom:10px;box-shadow:var(--sh-sm)}
.msg .tag{font-size:10px;opacity:.7;display:block;margin-bottom:3px}
.msg.bot{background:var(--bg-input);border-radius:16px 16px 16px 4px;align-self:flex-start}
.msg.agent{background:#EAFBF3;border:1px solid #C9F0DE;border-radius:16px 16px 16px 4px;align-self:flex-start}
.msg.user{background:var(--brand-grad);color:#fff;border-radius:16px 16px 4px 16px;align-self:flex-end}
.composer{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.composer input{flex:1;height:46px;border:1.5px solid var(--line-2);border-radius:var(--r-full);padding:0 18px;font:500 14px 'Plus Jakarta Sans'}
.composer input:focus{outline:none;border-color:var(--brand)}
.composer.locked input{background:var(--bg-input);cursor:not-allowed;color:var(--ink-mute)}
.composer .send{width:46px;height:46px;border-radius:50%;border:none;background:var(--brand);color:#fff;cursor:pointer;display:grid;place-items:center}
.composer.locked .send{background:#CBD2DE;cursor:not-allowed}

/* ── INFO ── */
.info-pane{border-left:1px solid var(--line);padding:20px 18px;overflow-y:auto}
.info-pane h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mute);font-weight:700;margin:18px 0 10px}
.info-pane h4:first-child{margin-top:0}
.kv{font-size:13px;margin-bottom:9px}.kv b{display:block;color:var(--ink-mute);font-size:11px;font-weight:600;margin-bottom:1px}
.hist{font-size:12.5px;padding:9px 11px;background:var(--bg-input);border-radius:10px;margin-bottom:8px}
.hist b{font-weight:700}.hist small{color:var(--ink-mute);display:block}
.esc{background:#FFF7E6;border:1px solid #FCE4B0;border-radius:10px;padding:10px;margin-bottom:8px}
.esc b{font-size:12px;font-weight:800;color:#92400E;display:block}
.esc p{font-size:11.5px;color:#7a5a1e;margin:3px 0 7px}
.esc button{font:700 11px 'Plus Jakarta Sans';border:none;background:var(--bot-on);color:#fff;border-radius:7px;padding:5px 11px;cursor:pointer}
.esc button:hover{filter:brightness(.95)}
.hoff{display:inline-flex;align-items:center;gap:4px;background:rgba(251,176,64,.16);color:#B26B00;border-radius:var(--r-full);padding:2px 9px;font-size:10.5px;font-weight:700;margin-left:6px}

@media(max-width:1100px){.inbox{grid-template-columns:300px 1fr}.info-pane{display:none}}
@media(max-width:820px){
  .main{padding:12px}
  .inbox{grid-template-columns:1fr;height:calc(100vh - 96px);border-radius:18px}
  .list{display:none}
  .chat__bar{padding:0 14px;min-height:58px}
  .chat__who{gap:10px}
  .chat__who b{font-size:14px}
  .chat__who small{display:none}      /* oculta "Primer contacto" en móvil */
  .bot-ctrl .lbl{display:none}         /* deja solo el toggle */
  .msg{max-width:84%}
}
</style>
</head>
<body>
<aside id="sidebar"></aside>

<main class="main">
  <div class="inbox">

    <!-- LISTA -->
    <div class="list">
      <div class="list__head">
        <div class="t"><h2>Mensajes</h2><span class="badge-pill b-hot" id="unread">3 sin leer</span></div>
        <div class="search"><i data-lucide="search"></i><input placeholder="Buscar conversación…" oninput="filterList(this.value)"></div>
      </div>
      <div class="filters" id="filters">
        <div class="fpill active" data-f="all">Todos</div>
        <div class="fpill" data-f="hot">🔥 Calientes</div>
        <div class="fpill" data-f="new">Nuevos</div>
        <div class="fpill" data-f="manual">👤 Manual</div>
      </div>
      <div class="convos" id="convos"></div>
    </div>

    <!-- CHAT -->
    <div class="chat">
      <div class="chat__bar">
        <div class="chat__who">
          <div class="ava-ini" id="cAva" style="background:#F58220">MR</div>
          <div><b id="cName">—</b> <span class="badge-pill" id="cIntent"></span><span class="hoff" id="cHandoff" style="display:none"></span><br><small id="cFirst"></small></div>
        </div>
        <div class="bot-ctrl">
          <div class="lbl"><b id="botLbl">🤖 Bot activo</b><small id="botSub">respondiendo automáticamente</small></div>
          <div class="toggle on" id="botToggle" onclick="toggleBot()"></div>
        </div>
      </div>
      <div class="banner" id="banner"><i data-lucide="alert-triangle"></i> Bot pausado — tú tienes el control. El bot no responderá hasta que lo reactives.</div>
      <div class="msgs" id="msgs"></div>
      <div class="composer locked" id="composer">
        <input id="msgInput" placeholder="El bot está respondiendo…" disabled>
        <button class="send" onclick="sendMsg()"><i data-lucide="send"></i></button>
      </div>
    </div>

    <!-- INFO -->
    <div class="info-pane">
      <h4>Información</h4>
      <div class="kv"><b>Nombre</b><span id="iName">—</span></div>
      <div class="kv"><b>Teléfono</b><span id="iPhone">—</span></div>
      <div class="kv"><b>Primer contacto</b><span id="iFirst">—</span></div>
      <div class="kv"><b>Intención</b><span id="iIntent">—</span></div>
      <h4>Historial de citas</h4>
      <div id="iHist"></div>
      <h4>Escalaciones</h4>
      <div id="iEsc"></div>
      <h4>Notas</h4>
      <textarea class="textarea" id="iNotes" placeholder="Escribe una nota…" style="min-height:80px;font-size:13px" oninput="saveNotes()"></textarea>
    </div>

  </div>
</main>

<script src="./assets/data.js"></script>
<script>
lucide.createIcons();
VD.renderSidebar('mensajes');

let LEADS=[], APPTS=[], ESC=[], current=null, filter='all', search='';
const KIND={paid_removal:'Quitar cita (pagada)',paid_reschedule:'Reprogramar cita (pagada)',paid_order_cancel:'Cancelar pedido (pagado)'};

function botKey(id){return 'vendemia_bot_'+id;}
function isBotOn(l){const s=localStorage.getItem(botKey(l.id));return s?s==='on':l.bot_active===1;}

function renderList(){
  const q=search.toLowerCase();
  const items=LEADS.filter(l=>{
    if(filter==='hot'&&l.intent!=='purchase_ready')return false;
    if(filter==='new'&&l.status!=='new')return false;
    if(filter==='manual'&&isBotOn(l))return false;
    if(q&&!(l.name.toLowerCase().includes(q)||(l.last_message||'').toLowerCase().includes(q)))return false;
    return true;
  });
  document.getElementById('convos').innerHTML=items.map(l=>{
    const it=VD.INTENT[l.intent], on=isBotOn(l);
    return `<div class="citem ${current&&current.id===l.id?'active':''}" onclick="openChat('${l.id}')">
      <div class="ava-ini" style="background:${l.color}">${l.initials}</div>
      <span class="botdot" style="background:${on?'var(--bot-on)':'var(--bot-off)'}"></span>
      <div class="info"><div class="top"><b>${l.name}</b><span class="time">${l.lastTime}</span></div>
        <div class="prev">${l.last_message||''}</div>
        <span class="badge-pill ${it.cls}" style="margin-top:5px">${it.short}</span></div>
    </div>`;
  }).join('')||'<p class="muted" style="padding:20px;font-size:13px">Sin resultados.</p>';
}
function filterList(v){search=v;renderList();}
document.getElementById('filters').addEventListener('click',e=>{
  const p=e.target.closest('.fpill'); if(!p)return;
  document.querySelectorAll('.fpill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); filter=p.dataset.f; renderList();
});

async function openChat(id){
  current=LEADS.find(l=>l.id===id); renderList();
  const it=VD.INTENT[current.intent];
  document.getElementById('cAva').textContent=current.initials;
  document.getElementById('cAva').style.background=current.color;
  document.getElementById('cName').textContent=current.name;
  const ci=document.getElementById('cIntent'); ci.textContent=it.short; ci.className='badge-pill '+it.cls;
  const fc=new Date(current.created_at*1000).toLocaleDateString('es-PE',{day:'numeric',month:'short'});
  document.getElementById('cFirst').textContent='Primer contacto: '+fc;
  // handoff
  const hb=document.getElementById('cHandoff');
  if(current.handoff_at){const t=new Date(current.handoff_at*1000).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
    hb.style.display='inline-flex'; hb.innerHTML='🙋 Manual desde '+t;} else hb.style.display='none';
  // escalaciones del lead
  renderEsc(id);
  // info pane
  document.getElementById('iName').textContent=current.name;
  document.getElementById('iPhone').textContent=current.phone;
  document.getElementById('iFirst').textContent=fc;
  document.getElementById('iIntent').textContent=it.label;
  const hist=APPTS.filter(a=>a.lead_id===id);
  document.getElementById('iHist').innerHTML=hist.map(a=>`<div class="hist"><b>${a.service}</b><small>${a.slot_start} · ${a.status}</small></div>`).join('')||'<p class="muted" style="font-size:12.5px">Sin citas.</p>';
  document.getElementById('iNotes').value=localStorage.getItem('vendemia_notes_'+id)||current.customer_notes||'';
  // mensajes
  const msgs=await VD.api.messages(id);
  document.getElementById('msgs').innerHTML='<div class="tstamp">Hoy</div>'+msgs.map(m=>{
    const role=m.role==='user'?'user':(m.role==='agent'?'agent':'bot');
    const tag=role==='bot'?'🤖 Mia':(role==='agent'?'👤 Tú':'');
    return `<div class="msg ${role}">${tag?`<span class="tag">${tag}</span>`:''}${m.content}</div>`;
  }).join('');
  const box=document.getElementById('msgs'); box.scrollTop=box.scrollHeight;
  syncBot();
}

function syncBot(){
  const on=isBotOn(current);
  document.getElementById('botToggle').classList.toggle('on',on);
  document.getElementById('botLbl').textContent=on?'🤖 Bot activo':'👤 Modo manual';
  document.getElementById('botSub').textContent=on?'respondiendo automáticamente':'tú respondes';
  document.getElementById('banner').classList.toggle('show',!on);
  const c=document.getElementById('composer'), inp=document.getElementById('msgInput');
  c.classList.toggle('locked',on); inp.disabled=on;
  inp.placeholder=on?'El bot está respondiendo…':'Escribe tu mensaje…';
}
function toggleBot(){
  if(!current)return;
  const on=!isBotOn(current);
  localStorage.setItem(botKey(current.id),on?'on':'off');
  current.bot_active=on?1:0; syncBot(); renderList();
}
function sendMsg(){
  if(!current||isBotOn(current))return;
  const inp=document.getElementById('msgInput'); const v=inp.value.trim(); if(!v)return;
  const box=document.getElementById('msgs');
  box.insertAdjacentHTML('beforeend',`<div class="msg agent"><span class="tag">👤 Tú</span>${v}</div>`);
  inp.value=''; box.scrollTop=box.scrollHeight;
}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
function saveNotes(){if(current)localStorage.setItem('vendemia_notes_'+current.id,document.getElementById('iNotes').value);}

function renderEsc(id){
  const items=ESC.filter(e=>e.lead_id===id && e.status==='pending');
  document.getElementById('iEsc').innerHTML=items.map(e=>
    `<div class="esc"><b>⚠️ ${KIND[e.kind]||e.kind}</b><p>${e.detail}</p>
      <button onclick="resolveEsc('${e.id}')"><i data-lucide="check" style="width:11px;height:11px"></i> Resolver</button></div>`).join('')
    || '<p class="muted" style="font-size:12.5px">Sin escalaciones pendientes.</p>';
  lucide.createIcons();
}
function resolveEsc(eid){
  const e=ESC.find(x=>x.id===eid); if(e)e.status='resolved';
  VD.api.resolveEscalation(eid); renderEsc(current.id);
}

(async()=>{
  [LEADS,APPTS,ESC]=await Promise.all([VD.api.leads(),VD.api.appointments(),VD.api.escalations()]);
  renderList(); if(LEADS[0])openChat(LEADS[0].id);
})();
</script>
</body>
</html>
